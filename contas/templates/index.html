{% extends 'base_contas.html' %}
{% block title %} Sitema de contas pessoais | Página inicial {% endblock %}
{% block content %}
<div class="row mt-5">
    <h2>Controle suas contas pessoais.</h2>
</div>
<div class="row mt-5">
    <a href="{% url 'cadastrar_contas' %}">
        <h3>C - Cadastrar contas novas</h3>
    </a>
    <a href="{% url 'pesquisar_contas' %}">
        <h3>R - Listar todas as contas cadastradas</h3>
    </a>
    <a href="{% url 'atualizar_contas' %}">
        <h3>U - Atualizar uma conta</h3>
    </a>
    <a href="{% url 'remover_contas' %}">
        <h3>D - Remover uma conta</h3>
    </a>
</div>
{% endblock %}
